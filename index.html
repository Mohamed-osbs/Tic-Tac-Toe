<!DOCTYPE html>
<html lang="en">
<head>
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1> Tic Tac Toe</h1>
  <div class="modes">
    <button id="m2" onclick="setMode('multi')" class="active">
      Player vs Player
    </button>

    <button id="mai" onclick="setMode('ai')">
      Player vs AI
    </button>
  </div>
  <h2 id="status">Player X's Turn</h2>
  <div id="board" class="board"></div>
  <div class="scores">
    <div>X: <span id="sx">0</span></div>
    <div>O: <span id="so">0</span></div>
    <div>Draws: <span id="sd">0</span></div>
  </div>
  <div class="controls">
    <button onclick="restart()">Restart Game</button>
    <button onclick="resetScores()">Reset Scores</button>
  </div>
</div>
<script src="script.js"></script>

</body>
</html>
